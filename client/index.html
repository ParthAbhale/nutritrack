<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NutriTrack: log meals, track calories and macros, and review your nutrition history." />
    <meta name="theme-color" content="#3563F0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NutriTrack</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Default: light.
      try {
        var t = localStorage.getItem('nt-theme');
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
